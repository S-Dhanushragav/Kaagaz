# Voice sentence templates (English). Placeholders: {office} {bring} {fee} {time_limit} {caution} {member} {documents}.
# Filled by code from the verified plan step; the agent never writes these sentences.
language: en
documents:
  ration_card: ration card
  identity_card: Aadhaar card
  income_certificate: income certificate
  caste_certificate: caste certificate
values:  # display text where it differs from the knowledge-base value
  "15 days (Maharashtra Right to Public Services Act)": "15 days"
unverified: "Please confirm this at the office."  # said once, at the end, if any fact in the sentence is unverified
household: "Your family"
options: {same: same, different: different, not sure: not sure}
law_sets: "The law sets {time_limit} for this office."
procedures:
  aadhaar_name_correction: "{member}: go to the {office} to correct the name on the Aadhaar card. Fee: {fee}. {caution}"
  aadhaar_dob_correction: "{member}: go to the {office} to correct the date of birth on the Aadhaar card. Bring: {bring}. {caution}"
  ration_card_name_correction: "{member}: go to the {office} to correct the name on the ration card. Bring: {bring}. Fee: {fee}."
  ration_card_add_member: "{member}: ask the {office} to add this person to the ration card. Bring: {bring}. {caution}"
  income_certificate_new: "Apply for a new income certificate on the Aaple Sarkar portal or at an Aaple Sarkar Seva Kendra; the {office} issues it. The law sets {time_limit} for this office."
  caste_certificate_new: "{member}: apply to the {office} for a caste certificate. Start this first; it takes the longest. {caution}"
  aadhaar_enrolment: "{member}: go to the {office} to enrol for an Aadhaar card."
  self_declaration: "{member}: {documents}: you can also give a written declaration that the names on these belong to the same person. {caution}"
ask_at_office: "{member}: {documents}: ask at the office what to do about this."
questions:
  which_is_correct: "{member}: {documents}: which one is correct?"
  compare: "{member}: {documents}: please compare them. Are they the same or different?"
numbers:  # for speech only (screen text keeps digits)
  words: [zero, one, two, three, four, five, six, seven, eight, nine, ten, eleven, twelve, thirteen, fourteen, fifteen, sixteen, seventeen, eighteen, nineteen, twenty, twenty-one, twenty-two, twenty-three, twenty-four, twenty-five, twenty-six, twenty-seven, twenty-eight, twenty-nine, thirty, thirty-one, thirty-two, thirty-three, thirty-four, thirty-five, thirty-six, thirty-seven, thirty-eight, thirty-nine, forty, forty-one, forty-two, forty-three, forty-four, forty-five, forty-six, forty-seven, forty-eight, forty-nine, fifty, fifty-one, fifty-two, fifty-three, fifty-four, fifty-five, fifty-six, fifty-seven, fifty-eight, fifty-nine, sixty, sixty-one, sixty-two, sixty-three, sixty-four, sixty-five, sixty-six, sixty-seven, sixty-eight, sixty-nine, seventy, seventy-one, seventy-two, seventy-three, seventy-four, seventy-five, seventy-six, seventy-seven, seventy-eight, seventy-nine, eighty, eighty-one, eighty-two, eighty-three, eighty-four, eighty-five, eighty-six, eighty-seven, eighty-eight, eighty-nine, ninety, ninety-one, ninety-two, ninety-three, ninety-four, ninety-five, ninety-six, ninety-seven, ninety-eight, ninety-nine]  # 0-99
  hundreds: [one hundred, two hundred, three hundred, four hundred, five hundred, six hundred, seven hundred, eight hundred, nine hundred]  # 100, 200, ... 900
  thousand: thousand
  century: "{n} hundred"  # years 1100-1999: '<19> hundred <81>'
  months: [January, February, March, April, May, June, July, August, September, October, November, December]
  rupees: "{n} rupees"  # 'Rs 75' in English text
answers:  # options are read aloud with these labels; answers match ONLY number words or not-sure words
  labels: [Number one, Number two, Number three, Number four, Number five]  # short phrases are heard far better
  option: "{label}: {option}."
  instruction: "Please say number one, number two, and so on."
  retry: "Sorry, I did not catch that. Please say number one, number two, and so on."
  buttons: "Please tap your answer on the screen."
  numbers:  # words that mean option 1, 2, ... (digits 1-5 always count too)
    - [first, "1st", number one, option one]  # not bare "one": "the second one", "the one on ..."
    - [second, two, "2nd"]
    - [third, three, "3rd"]
    - [fourth, four, "4th"]
    - [fifth, five, "5th"]
  not_sure: [not sure, "don't know", do not know, no idea]
