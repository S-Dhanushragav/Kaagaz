values:
  Aadhaar Seva Kendra (nearest): ఆధార్ సేవా కేంద్రం (దగ్గరిది)
  Aadhaar Seva Kendra: ఆధార్ సేవా కేంద్రం
  Ration card / Tahsil supply office: రేషన్ కార్డు / తహసీల్ సరఫరా కార్యాలయం
  Supply office, or the Ration Card Management System online: సరఫరా కార్యాలయం, లేదా ఆన్‌లైన్‌లో రేషన్ కార్డు మేనేజ్‌మెంట్ సిస్టమ్
  Tahsil office: తహసీల్ కార్యాలయం
  Sub-Divisional Officer / Deputy Collector: సబ్-డివిజనల్ అధికారి / డిప్యూటీ కలెక్టర్
  Proof of date of birth (e.g. birth certificate): పుట్టిన తేదీకి రుజువు (ఉదాహరణకు బర్త్ సర్టిఫికెట్)
  Gazette notice of the name change, or birth certificate (whichever applies): పేరు మారిన గెజిట్ నోటీసు, లేదా బర్త్ సర్టిఫికెట్ (మీకు ఏది వర్తిస్తే అది).
  Proof for the person being added (e.g. birth certificate for a newborn, marriage certificate for a spouse): పేరు చేరుస్తున్న వ్యక్తి రుజువు (ఉదాహరణకు పుట్టిన బిడ్డకు బర్త్ సర్టిఫికెట్, భార్య లేదా భర్తకు పెళ్లి సర్టిఫికెట్).
  about Rs 75: సుమారు ₹75
  Rs 2: ₹2
  15 days (Maharashtra Right to Public Services Act): 15 రోజులు
  The name on Aadhaar can be updated only twice in a lifetime.: ఆధార్‌లో పేరును జీవితంలో రెండు సార్లు మాత్రమే మార్చుకోవచ్చు.
  ? The date of birth on Aadhaar can be updated only once in a lifetime. If the limit is used, a grievance and a visit to the UIDAI regional office with strong documents is needed.
  : ఆధార్‌లో పుట్టిన తేదీని జీవితంలో ఒక్కసారి మాత్రమే మార్చుకోవచ్చు. పరిమితి అయిపోతే, ఫిర్యాదు చేయాలి మరియు బలమైన పత్రాలతో UIDAI ప్రాంతీయ కార్యాలయానికి వెళ్లాలి.
  Confirm at the office which documents are needed.: ఏ పత్రాలు కావాలో కార్యాలయంలో అడిగి తెలుసుకోండి.
  The time limit is set by the district under the Right to Public Services Act.: గడువును జిల్లా, ప్రజా సేవల హక్కు చట్టం కింద నిర్ణయిస్తుంది.
  Acceptance of the declaration is up to the office.: మీ డిక్లరేషన్‌ను ఒప్పుకోవాలా వద్దా అనేది కార్యాలయం నిర్ణయిస్తుంది.
