values:
  Aadhaar Seva Kendra (nearest): ஆதார் சேவை மையம் (அருகில் உள்ளது)
  Aadhaar Seva Kendra: ஆதார் சேவை மையம்
  Ration card / Tahsil supply office: ரேஷன் அட்டை / தஹசீல் வழங்கல் அலுவலகம்
  Supply office, or the Ration Card Management System online: வழங்கல் அலுவலகம், அல்லது இணையத்தில் ரேஷன் அட்டை மேலாண்மை அமைப்பு
  Tahsil office: தஹசீல் அலுவலகம்
  Sub-Divisional Officer / Deputy Collector: உட்கோட்ட அலுவலர் / துணை ஆட்சியர்
  Proof of date of birth (e.g. birth certificate): பிறந்த தேதிக்கான சான்று (எ.கா. பிறப்புச் சான்றிதழ்)
  Gazette notice of the name change, or birth certificate (whichever applies): பெயர் மாற்றத்திற்கான அரசிதழ் அறிவிப்பு, அல்லது பிறப்புச் சான்றிதழ் (எது பொருந்துமோ அது)
  Proof for the person being added (e.g. birth certificate for a newborn, marriage certificate for a spouse): சேர்க்கப்படும் நபருக்கான சான்று (எ.கா. பிறந்த குழந்தைக்கு பிறப்புச் சான்றிதழ், கணவர் அல்லது மனைவிக்கு திருமணச் சான்றிதழ்)
  about Rs 75: சுமார் ₹75
  Rs 2: ₹2
  15 days (Maharashtra Right to Public Services Act): 15 நாட்கள்
  The name on Aadhaar can be updated only twice in a lifetime.: ஆதாரில் உள்ள பெயரை வாழ்நாளில் இரண்டு முறை மட்டுமே மாற்ற முடியும்.
  ? The date of birth on Aadhaar can be updated only once in a lifetime. If the limit is used, a grievance and a visit to the UIDAI regional office with strong documents is needed.
  : ஆதாரில் உள்ள பிறந்த தேதியை வாழ்நாளில் ஒரு முறை மட்டுமே மாற்ற முடியும். வாய்ப்பு முடிந்துவிட்டால், புகார் கொடுத்து, உறுதியான ஆவணங்களுடன் UIDAI மண்டல அலுவலகத்திற்கு நேரில் செல்ல வேண்டும்.
  Confirm at the office which documents are needed.: எந்த ஆவணங்கள் தேவை என்று அலுவலகத்தில் கேட்டு உறுதி செய்யுங்கள்.
  The time limit is set by the district under the Right to Public Services Act.: சேவை பெறும் உரிமைச் சட்டத்தின் கீழ் மாவட்டம்தான் கால வரம்பை முடிவு செய்கிறது.
  Acceptance of the declaration is up to the office.: உறுதிமொழி கடிதத்தை ஏற்பதா இல்லையா என்பதை அலுவலகம்தான் முடிவு செய்யும்.
