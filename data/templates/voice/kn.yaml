  Aadhaar Seva Kendra (nearest): ಆಧಾರ್ ಸೇವಾ ಕೇಂದ್ರ (ಹತ್ತಿರದ)
  Aadhaar Seva Kendra: ಆಧಾರ್ ಸೇವಾ ಕೇಂದ್ರ
  Ration card / Tahsil supply office: ರೇಷನ್ ಕಾರ್ಡ್ / ತಹಸೀಲ್ ಸರಬರಾಜು ಕಚೇರಿ
  Supply office, or the Ration Card Management System online: ಸರಬರಾಜು ಕಚೇರಿ, ಅಥವಾ ಆನ್‌ಲೈನ್‌ನಲ್ಲಿ ರೇಷನ್ ಕಾರ್ಡ್ ನಿರ್ವಹಣಾ ವ್ಯವಸ್ಥೆ
  Tahsil office: ತಹಸೀಲ್ ಕಚೇರಿ
  Sub-Divisional Officer / Deputy Collector: ಉಪವಿಭಾಗಾಧಿಕಾರಿ / ಉಪ ಜಿಲ್ಲಾಧಿಕಾರಿ
  Proof of date of birth (e.g. birth certificate): ಹುಟ್ಟಿದ ದಿನಾಂಕದ ಪುರಾವೆ (ಉದಾ. ಜನನ ಪ್ರಮಾಣಪತ್ರ)
  Gazette notice of the name change, or birth certificate (whichever applies): ಹೆಸರು ಬದಲಾವಣೆಯ ಗೆಜೆಟ್ ಸೂಚನೆ, ಅಥವಾ ಜನನ ಪ್ರಮಾಣಪತ್ರ (ಯಾವುದು ಅನ್ವಯಿಸುತ್ತದೋ ಅದು)
  Proof for the person being added (e.g. birth certificate for a newborn, marriage certificate for a spouse): ಸೇರಿಸುವ ವ್ಯಕ್ತಿಯ ಪುರಾವೆ (ಉದಾ. ಹೊಸದಾಗಿ ಹುಟ್ಟಿದ ಮಗುವಿಗೆ ಜನನ ಪ್ರಮಾಣಪತ್ರ, ಸಂಗಾತಿಗೆ ಮದುವೆ ಪ್ರಮಾಣಪತ್ರ)
  about Rs 75: ಸುಮಾರು ₹75
  Rs 2: ₹2
  15 days (Maharashtra Right to Public Services Act): 15 ದಿನಗಳು
  The name on Aadhaar can be updated only twice in a lifetime.: ಆಧಾರ್‌ನಲ್ಲಿ ಹೆಸರನ್ನು ಜೀವನದಲ್ಲಿ ಎರಡು ಬಾರಿ ಮಾತ್ರ ಬದಲಾಯಿಸಬಹುದು.
  ? The date of birth on Aadhaar can be updated only once in a lifetime. If the limit is used, a grievance and a visit to the UIDAI regional office with strong documents is needed.
  : ಆಧಾರ್‌ನಲ್ಲಿ ಹುಟ್ಟಿದ ದಿನಾಂಕವನ್ನು ಜೀವನದಲ್ಲಿ ಒಮ್ಮೆ ಮಾತ್ರ ಬದಲಾಯಿಸಬಹುದು. ಮಿತಿ ಮುಗಿದಿದ್ದರೆ, ದೂರು ನೀಡಬೇಕು ಮತ್ತು ಬಲವಾದ ದಾಖಲೆಗಳೊಂದಿಗೆ UIDAI ಪ್ರಾದೇಶಿಕ ಕಚೇರಿಗೆ ಹೋಗಬೇಕು.
  Confirm at the office which documents are needed.: ಯಾವ ದಾಖಲೆಗಳು ಬೇಕು ಎಂದು ಕಚೇರಿಯಲ್ಲಿ ಕೇಳಿ ಖಚಿತಪಡಿಸಿಕೊಳ್ಳಿ.
  The time limit is set by the district under the Right to Public Services Act.: ಸಾರ್ವಜನಿಕ ಸೇವೆಗಳ ಹಕ್ಕು ಕಾಯ್ದೆಯಡಿ ಜಿಲ್ಲೆಯು ಸಮಯದ ಮಿತಿಯನ್ನು ನಿಗದಿ ಮಾಡುತ್ತದೆ.
  Acceptance of the declaration is up to the office.: ಘೋಷಣಾಪತ್ರವನ್ನು ಒಪ್ಪಿಕೊಳ್ಳುವುದು ಕಚೇರಿಗೆ ಬಿಟ್ಟದ್ದು.
