  "The name on Aadhaar can be updated only twice in a lifetime.": "आधार पर नाम जीवन में केवल दो बार बदला जा सकता है।"
  "The date of birth on Aadhaar can be updated only once in a lifetime. If the limit is used, a grievance and a visit to the UIDAI regional office with strong documents is needed.": "आधार पर जन्म तिथि जीवन में केवल एक बार बदली जा सकती है। यह मौका पहले ही इस्तेमाल हो चुका हो तो शिकायत दर्ज करके, पक्के दस्तावेज़ों के साथ यूआईडीएआई के क्षेत्रीय कार्यालय जाना होगा।"
  "Confirm at the office which documents are needed.": "कौन से दस्तावेज़ चाहिए, यह कार्यालय में पूछकर पक्का करें।"
  "The time limit is set by the district under the Right to Public Services Act.": "लोक सेवा अधिकार कानून के तहत समय-सीमा ज़िला तय करता है।"
  "Acceptance of the declaration is up to the office.": "घोषणा-पत्र स्वीकार करना या नहीं, यह कार्यालय तय करता है।"
