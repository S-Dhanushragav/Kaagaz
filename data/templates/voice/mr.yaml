  "The date of birth on Aadhaar can be updated only once in a lifetime. If the limit is used, a grievance and a visit to the UIDAI regional office with strong documents is needed.": "आधारवरील जन्मतारीख आयुष्यात फक्त एकदाच बदलता येते. ही संधी आधीच वापरली असेल तर तक्रार करून, भक्कम कागदपत्रांसह यूआयडीएआयच्या प्रादेशिक कार्यालयात जावे लागते."
  "Confirm at the office which documents are needed.": "कोणती कागदपत्रे लागतील ते कार्यालयात विचारून खात्री करा."
  "The time limit is set by the district under the Right to Public Services Act.": "लोकसेवा हक्क कायद्यानुसार वेळमर्यादा जिल्हा ठरवतो."
  "Acceptance of the declaration is up to the office.": "प्रतिज्ञापत्र स्वीकारायचे की नाही ते कार्यालय ठरवते."
