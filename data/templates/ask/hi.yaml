# Ask Kaagaz (Hindi). MACHINE-DRAFTED: needs review by a native speaker.
# Placeholders: {member} {document} {office} {scheme}. Names and documents stay labels ("{member}: ...").
language: hi
brand: "कागज़"  # the app's name, spelled as the UI spells it (frontend/src/i18n.ts appName)
brand_wrong:  # an answer that names the app any of these ways is rejected (agents/ask_check.py)
  - '(?<![\u0900-\u097f])कागद(?:कडे|ला|ने|च्या|ची|चा|चे|मध्ये)?(?![\u0900-\u097f])'
  - '(?i)\bkaa?gh?aa?[zdj]\b'
replies:
  out_of_scope: "मैं सिर्फ़ आपके दस्तावेज़ों और महाराष्ट्र की इन 5 योजनाओं में मदद कर सकता हूँ: लाडकी बहीण, प्रधानमंत्री उज्ज्वला, रमाई आवास, संजय गांधी निराधार और श्रावणबाल। पूछिए कि कौन आवेदन कर सकता है, कौन से दस्तावेज़ चाहिए, या आपकी जाँच में क्या मिला।"
  id_number: "मैं आधार या कोई दूसरा पहचान नंबर न पढ़ता हूँ, न माँगता हूँ। मैं बता सकता हूँ कि कौन से दस्तावेज़ चाहिए और आपकी जाँच में क्या मिला।"
  other_language: "मैं हिंदी, मराठी या अंग्रेज़ी में जवाब दे सकता हूँ। कृपया इनमें से किसी एक भाषा में फिर से पूछिए।"
  not_sure: "मुझे पक्का नहीं पता। आपकी जाँच में यह लिखा है:"
  not_sure_no_check: "मुझे पक्का नहीं पता। योजना के नियमों में यह लिखा है:"
  not_sure_nothing: "मुझे पक्का नहीं पता। कृपया कार्यालय में पूछिए।"
  unavailable: "माफ़ कीजिए, अभी जवाब नहीं दे सका। एक मिनट बाद फिर कोशिश कीजिए; आपकी जाँच पर इसका कोई असर नहीं है।"
  check_at_office: "इसमें से कुछ बातें अभी किसी सरकारी स्रोत से पक्की नहीं हैं: कार्यालय में पुष्टि करें।"
  limit: "आपने इस घंटे बहुत सवाल पूछे हैं। कृपया थोड़ी देर बाद फिर पूछिए।"
