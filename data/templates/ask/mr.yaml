# Ask Kaagaz (Marathi). MACHINE-DRAFTED: needs review by a native speaker.
# Placeholders: {member} {document} {office} {scheme}. Names and documents stay labels ("{member}: ..."): Marathi
# would inflect them before a postposition.
language: mr
brand: "कागज"  # the app's name, spelled as the UI spells it (frontend/src/i18n.ts appName)
brand_wrong:  # an answer that names the app any of these ways is rejected (agents/ask_check.py)
  # कागद is also the word 'paper' ("एक कागद ओळखता आला नाही" is right): rejected only as a name. The noun takes कागदा-
  # before a postposition (कागदावर, कागदाला); a name keeps कागद (कागदकडे, कागदला). Also "मी कागद" and a sentence that
  # opens with कागद.
  - '(?<![\u0900-\u097f])कागद(?:कडे|कडून|ला|ने|च्या|ची|चा|चे|मध्ये|नुसार)(?![\u0900-\u097f])'
  - 'मी कागद(?![\u0900-\u097f])'
  - '(?:^|[.।?!:]\s*)कागद(?![\u0900-\u097f])'
  - '(?i)\bkaa?gh?aa?[zdj]\b'
replies:
  out_of_scope: "मी फक्त तुमची कागदपत्रे आणि महाराष्ट्रातील या 5 योजनांबद्दल मदत करू शकतो: लाडकी बहीण, प्रधानमंत्री उज्ज्वला, रमाई आवास, संजय गांधी निराधार आणि श्रावणबाळ. कोण अर्ज करू शकते, कोणती कागदपत्रे लागतात, किंवा तुमच्या तपासणीत काय आढळले ते विचारा."
  id_number: "मी आधार किंवा इतर ओळख क्रमांक वाचून दाखवत नाही आणि विचारतही नाही. कोणती कागदपत्रे लागतात आणि तुमच्या तपासणीत काय आढळले ते मी सांगू शकतो."
  other_language: "मी मराठी, हिंदी, इंग्रजी, तमिळ, तेलुगू किंवा कन्नड भाषेत उत्तर देऊ शकतो. कृपया यापैकी एका भाषेत पुन्हा विचारा."
  not_sure: "मला नक्की माहीत नाही. तुमच्या तपासणीत हे आहे:"
  not_sure_no_check: "मला नक्की माहीत नाही. योजनेच्या नियमांत हे आहे:"
  not_sure_nothing: "मला नक्की माहीत नाही. कृपया कार्यालयात विचारा."
  unavailable: "माफ करा, आत्ता उत्तर देता आले नाही. एका मिनिटाने पुन्हा प्रयत्न करा; तुमच्या तपासणीवर याचा परिणाम होत नाही."
  check_at_office: "यातील काही माहिती अजून अधिकृत स्रोताकडून पक्की झालेली नाही: कार्यालयात खात्री करा."
  limit: "तुम्ही या तासात बरेच प्रश्न विचारले आहेत. कृपया थोड्या वेळाने पुन्हा विचारा."
