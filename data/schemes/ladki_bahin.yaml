short: {en: "Ladki Bahin", mr: "लाडकी बहीण", hi: "लाडकी बहीण", ta: "லாட்கி பஹிண்", te: "లాడ్కీ బహీణ్", kn: "ಲಾಡಕಿ ಬಹಿಣ್"}
# One-line benefit for the app. en from the developer; hi/mr text machine-translated from it.
benefit:
  text: {en: "₹1,500 per month", mr: "दरमहा ₹1,500", hi: "₹1,500 प्रति माह", ta: "மாதம் ₹1,500", te: "నెలకు ₹1,500", kn: "ತಿಂಗಳಿಗೆ ₹1,500"}
  status: verified
  source: myscheme.gov.in
  source_url: "https://myscheme.gov.in/schemes/mmlby"
  last_checked: 2026-10-30
rules:
  - id: applicant_gender
    check: gender
    value: female
    status: verified
    source: myscheme.gov.in
    source_url: https://myscheme.gov.in/schemes/mmlby
    last_checked: 2026-10-29
  - id: applicant_min_age
    check: age_min  # inclusive
    value: 21
    status: verified
    source: myscheme.gov.in
    source_url: https://myscheme.gov.in/schemes/mmlby
    last_checked: 2026-10-29
  - id: applicant_max_age
    check: age_max  # inclusive
    value: 65
    status: verified
    source: myscheme.gov.in
    source_url: https://myscheme.gov.in/schemes/mmlby
    last_checked: 2026-10-29
  - id: family_income
    check: income_max  # inclusive
    value: 250000
    status: verified
    source: myscheme.gov.in
    source_url: https://myscheme.gov.in/schemes/mmlby
    last_checked: 2026-10-29
  - id: income_certificate
    check: income_certificate_unless_card
    value: {not_required_for_cards: [yellow, orange]}
    status: verified
    source: myscheme.gov.in
    source_url: https://myscheme.gov.in/schemes/mmlby
    last_checked: 2026-10-29
    interpretation: >-
      Our reading, not the source's text: a Yellow or Orange ration card satisfies the income
      requirement when there is no income certificate. If an income certificate is present and
      shows income above the limit, the result is not eligible regardless of card colour.
      White card or no ration card: the income certificate is required.
