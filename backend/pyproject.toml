[project]
name = "kaagaz-backend"
version = "0.1.0"
description = "Kaagaz backend: voice-first welfare document checker"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic>=2",
    "pydantic-settings>=2",
    "openai>=1",
    "python-dotenv",
    "opencv-python-headless",
    "meta-sam-parser==0.1.0",  # Meta's official SAM 3.1 output/mask parser (pure Python)
    "rapidfuzz",  # fuzzy name matching
    "indic-transliteration",  # Devanagari -> Latin for cross-script name matching
    "PyYAML",  # scheme rules in data/schemes/
    "langgraph",  # pipeline graph; ask_family as an interrupt (graph/build.py)
    "python-multipart",  # FastAPI form uploads (video, answer audio)
    "psycopg[binary]>=3.2",  # case files on Postgres (Neon); storage/postgres.py
]

[project.optional-dependencies]
dev = ["pytest"]
# Synthetic SPECIMEN document generator (synthetic/); not needed by the backend at runtime
synthetic = ["playwright", "jinja2"]
# Speech output with Meta MMS-TTS (clients/tts.py), CPU. Install torch from the CPU index:
#   pip install -e ".[tts]" --extra-index-url https://download.pytorch.org/whl/cpu
tts = ["torch", "transformers"]
# Deployment to Modal (deploy/modal_app.py); not needed at runtime
deploy = ["modal"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "agents*", "clients*", "graph*", "matching*", "rules*", "schemas*", "storage*", "vision*"]

[tool.pytest.ini_options]
pythonpath = [".", ".."]  # ".." makes the repo-root synthetic/ package importable in tests
markers = ["live_db: talks to the real database (DATABASE_URL); run with `pytest -m live_db`"]
addopts = "-m 'not live_db'"  # tests stay offline by default
testpaths = ["tests"]
